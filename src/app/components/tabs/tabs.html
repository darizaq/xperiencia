<div class="tabs" role="tablist" aria-label="Elegir día de la expedición">
  @for (item of items(); track item.date.getTime(); let index = $index) {
    <button
      class="tabs__tab"
      type="button"
      role="tab"
      [id]="'tab-' + index"
      [attr.aria-selected]="isSelected(index)"
      [attr.aria-controls]="'day-' + index"
      [attr.aria-label]="dayNumber(item.date) + ' de ' + monthShort(item.date)"
      [tabIndex]="isSelected(index) ? 0 : -1"
      [class.tabs__tab--selected]="isSelected(index)"
      (click)="selectTab(item)"
      (keydown)="onTabKeydown($event, index)"
    >
      {{ dayNumber(item.date) }}
    </button>
  }
</div>

<div class="tabs__panels">
  @if (selectedItem(); as item) {
    <div class="day" [id]="'day-' + selectedIndex()" role="tabpanel" [attr.aria-labelledby]="'tab-' + selectedIndex()">
      <div class="day__top">
        <div class="day__datebox">
          <div class="day__num">{{ dayNumber(item.date) }}</div>
          <div class="day__mon">{{ monthShort(item.date) }}</div>
        </div>
        <div class="day__text">
          <div class="day__eyebrow">{{ item.basePlace }}</div>
          <div class="day__title">{{ item.title }}</div>
        </div>
        <div class="day__icons">
          <app-icon-tooltip
            [dim]="!item.mealsIncluded"
            [tooltip]="item.mealsIncluded ? 'Alimentación incluida' : 'Alimentación no incluida'"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 3v5a2.5 2.5 0 0 0 5 0V3" />
              <path d="M9.5 3v5" />
              <path d="M9.5 10.5V21" />
              <path d="M18 21v-8c-1.7 0-3-1.3-3-3 0-3 1.3-6 3-7 1.7 1 3 4 3 7 0 1.7-1.3 3-3 3" />
              @if (!item.mealsIncluded) {
                <path d="M4.2 20 19.8 4" stroke-width="1.7" />
              }
            </svg>
          </app-icon-tooltip>
          <app-icon-tooltip
            [dim]="!item.acommodationIncluded"
            [tooltip]="item.acommodationIncluded ? 'Hospedaje incluido' : 'Hospedaje no incluido'"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 7v12" />
              <path d="M3 13.5h18" />
              <path d="M21 19v-5a3 3 0 0 0-3-3H9.5v2.5" />
              <circle cx="6.9" cy="10.4" r="1.9" />
              @if (!item.acommodationIncluded) {
                <path d="M4.2 20 19.8 4" stroke-width="1.7" />
              }
            </svg>
          </app-icon-tooltip>
        </div>
      </div>
      <div class="day__desc" [innerHTML]="item.content"></div>
    </div>
  }
</div>
