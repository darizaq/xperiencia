<div class="date-range-tabs" role="tablist" aria-label="Elegir fecha de salida">
  @for (range of ranges(); track range.startDate.getTime(); let index = $index) {
    <button
      type="button"
      class="date-range-tabs__tab"
      [class.date-range-tabs__tab--selected]="isSelected(index)"
      role="tab"
      [attr.aria-selected]="isSelected(index)"
      (click)="selectRange(index)"
    >
      {{ range.startDate | date: 'MMM d y' : undefined : 'es' }} - {{ range.endDate | date: 'MMM d y' : undefined : 'es' }}
    </button>
  }
</div>
