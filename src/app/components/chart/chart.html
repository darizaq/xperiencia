<div class="chart">
  <header class="chart__head">
    <span class="chart__tile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2.5 19 9 8l4 6 2.5-3.8L21.5 19z" />
        <path d="M9 8l1.6 2.7" />
      </svg>
    </span>
    <h2 class="chart__title">Perfil de altura</h2>
  </header>

  <svg class="chart__svg" [class.chart__svg--has-selection]="selectedIndex() !== -1" [attr.viewBox]="viewBox" xmlns="http://www.w3.org/2000/svg" role="img">
    <defs>
      <linearGradient id="chartAreaFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#C4C4C4" stop-opacity="0.20" />
        <stop offset="100%" stop-color="#C4C4C4" stop-opacity="0.02" />
      </linearGradient>
    </defs>

    @for (tick of ticks(); track tick.y) {
      <line
        class="chart__gridline"
        [attr.x1]="plotLeft"
        [attr.y1]="tick.y"
        [attr.x2]="plotRight"
        [attr.y2]="tick.y"
      />
      <text class="chart__ylabel" [attr.x]="yLabelX" [attr.y]="tick.y + 4" text-anchor="end">{{ tick.label }}</text>
    }

    <text class="chart__unit" [attr.transform]="'translate(' + unitLabelX + ',' + plotBottom / 2 + ') rotate(-90)'" text-anchor="middle">msnm</text>

    <polygon class="chart__area" [attr.points]="areaPath()" fill="url(#chartAreaFill)" />
    <polyline class="chart__line" [attr.points]="linePath()" fill="none" />

    @if (selectedPoint(); as selected) {
      <g class="chart__highlight-line-g" [style.transform]="'translateX(' + selected.x + 'px)'">
        <line class="chart__highlight-line" x1="0" y1="26" x2="0" [attr.y2]="plotBottom" />
      </g>
      <g
        class="chart__highlight-ring-g"
        [style.transform]="'translate(' + selected.x + 'px,' + selected.y + 'px)'"
      >
        <circle
          class="chart__highlight-ring"
          cx="0"
          cy="0"
          [attr.r]="selected.radius + 6"
          [attr.stroke]="selected.color"
        />
      </g>
    }

    @for (point of chartPoints(); track point.date.getTime()) {
      <g
        class="chart__point"
        [class.chart__point--on]="isSelected($index)"
        (click)="selectMarker(point.date)"
      >
        <circle class="chart__point-hit" [attr.cx]="point.x" [attr.cy]="point.y" r="20" fill="none" pointer-events="all" />
        <circle class="chart__point-halo" [attr.cx]="point.x" [attr.cy]="point.y" r="14" />
        <circle
          class="chart__point-dot"
          [attr.cx]="point.x"
          [attr.cy]="point.y"
          [attr.r]="point.radius"
          [attr.fill]="point.color"
        />
        @if (point.value) {
          <text
            class="chart__value"
            [class.chart__value--peak]="point.category === 'summit'"
            [attr.x]="point.x"
            [attr.y]="point.y - point.radius - 10"
            text-anchor="middle"
          >{{ point.value }}</text>
        }
      </g>
    }

    @for (label of xLabels(); track label.date.getTime(); let index = $index) {
      <text
        class="chart__xday"
        [class.chart__xday--on]="isSelected(index)"
        [attr.x]="label.x"
        [attr.y]="xLabelY"
        text-anchor="middle"
      >
        @if (label.monthPrefix) {
          <tspan class="chart__xday-prefix">{{ label.monthPrefix }} </tspan>
        }{{ label.day }}
      </text>
    }
  </svg>

  <div class="chart__legend">
    @for (category of legendCategories; track category) {
      <span class="chart__legend-item">
        <i class="chart__legend-dot" [style.background]="legendColor(category)"></i>
        {{ legendLabel(category) }}
      </span>
    }
  </div>

  <p class="chart__note">La altura indicada corresponde a la altura máxima alcanzada cada día.</p>
</div>
