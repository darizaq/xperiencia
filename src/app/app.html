<main class="demo">
  <!-- Demo-only: switches between destinations, each with its own Itinerary data. -->
  <div class="demo__destinations" role="tablist" aria-label="Elegir destino">
    @for (destination of destinations; track destination.key; let index = $index) {
      <button
        type="button"
        class="demo__destination"
        [class.demo__destination--selected]="isSelectedDestination(index)"
        role="tab"
        [attr.aria-selected]="isSelectedDestination(index)"
        (click)="selectDestination(index)"
      >
        {{ destination.label }}
      </button>
    }
  </div>

  <!-- Keyed by destination so switching destinations resets the Itinerary component's
       own selection state instead of carrying over a day/date-range from the previous one. -->
  @for (destination of [selectedDestination()]; track destination.key) {
    <app-itinerary
      class="demo__itinerary"
      [dateRanges]="destination.dateRanges"
      [items]="destination.items"
      [legendLabels]="destination.legendLabels"
    />
  }
</main>

<router-outlet />
